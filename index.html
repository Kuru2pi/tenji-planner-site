<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>展示空間プランナー</title>
<script>window.PLANNER_LOCAL = true;try { const t = JSON.parse(localStorage.getItem('planner-prefs') || '{}').theme; if (t) document.documentElement.dataset.theme = t; } catch {}</script>
<link rel="stylesheet" href="style.css">
<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/",
    "three-mesh-bvh": "https://cdn.jsdelivr.net/npm/three-mesh-bvh@0.7.3/build/index.module.js"
  }
}
</script>
</head>
<body>
<header id="topbar">
  <div class="brand"><span class="mark">展</span><span class="brand-name">展示空間プランナー</span></div>
  <div class="seg" id="viewSeg">
    <button data-view="3d" class="on">3D</button>
    <button data-view="plan">平面図</button>
  </div>
  <div class="spacer"></div>
  <button class="add-btn" id="addBtn"><svg class="i" viewBox="0 0 16 16"><path d="M8 3v10M3 8h10"/></svg>追加</button>
  <button class="icon-btn" id="undoBtn" title="元に戻す（Ctrl+Z）"><svg class="i" viewBox="0 0 16 16"><path d="M5.5 4 2.5 7l3 3M3 7h7a3.5 3.5 0 0 1 0 7H8"/></svg></button>
  <button class="icon-btn" id="redoBtn" title="やり直す（Ctrl+Shift+Z）"><svg class="i" viewBox="0 0 16 16"><path d="m10.5 4 3 3-3 3M13 7H6a3.5 3.5 0 0 0 0 7h2"/></svg></button>
  <button class="icon-btn help-btn" id="helpBtn" title="使い方ガイド">？</button>
  <button class="icon-btn" id="moreBtn" title="その他"><svg class="i" viewBox="0 0 16 16"><circle cx="3.5" cy="8" r=".8"/><circle cx="8" cy="8" r=".8"/><circle cx="12.5" cy="8" r=".8"/></svg></button>
  <div id="peers"></div>
  <div id="conn" title="未接続"></div>

  <div id="settings" class="popover hidden">
    <div class="pop-row"><span>スナップ</span><span class="chip-pair"><button class="chip on" id="snapBtn">オン</button><div class="nf center hdr-num" id="snapInc"></div></span></div>
    <div class="pop-row"><span>断面（3D）</span><span class="chip-pair"><button class="chip on" id="clipBtn">オン</button><div class="nf center hdr-num" id="clipH"></div></span></div>
    <div class="pop-row"><span>名前と寸法</span><button class="chip on" id="labelsBtn">表示</button></div>
    <div class="pop-row"><span>既存の空間を透かす</span><button class="chip" id="xrayBtn">透視</button></div>
    <div class="pop-row"><span>移動・回転の基準</span><button class="chip" id="orientBtn">グローバル</button></div>
    <div class="pop-row"><span>画面の色</span><button class="chip" id="themeBtn">ライト／ダーク</button></div>
  </div>
</header>

<div id="main">
  <section id="viewArea">
    <div id="viewport" tabindex="-1">
      <div id="labels"></div>
      <div id="sceneTabs" class="hidden"></div>
      <div id="viewInfo" class="hidden"></div>
      <span id="modalText" class="hidden"></span>
      <div id="navGizmo">
        <canvas id="gizmoCanvas" width="192" height="192"></canvas>
        <div class="navrow hidden">
          <button class="navbtn" id="navZoom"></button><button class="navbtn" id="navPan"></button>
          <button class="navbtn" id="navEye"></button><button class="navbtn" id="navOrtho"></button>
        </div>
      </div>
      <div id="toolbar"></div>
      <div id="vcb"><span id="vcbL"></span><span id="vcbV"></span></div>
      <div id="lastOp" class="hidden"><div class="ph"><span id="lastOpTitle"></span><span class="lo-tog">−</span></div><div class="pb" id="lastOpBody"></div></div>
      <div id="cursor3d"></div>
      <div id="selRect" class="hidden"></div>
      <div id="snapMark" class="hidden"></div>
      <div id="dropHint" class="hidden">ここにドロップして読み込み（3Dデータ・画像）</div>
      <div id="toast" style="opacity:0"></div>
      <div id="loading">展示空間を読み込み中…</div>

      <aside class="card hidden" id="rightCol">
        <div class="rtabs hidden" id="rightTabs"><button class="rtab on" data-tab="props"></button></div>
        <div id="rightBody"></div>
      </aside>
    </div>
  </section>

  <aside class="drawer hidden" id="leftCol">
    <div class="side-head">
      <span class="side-title">オブジェクト一覧</span>
      <input class="tf osearch" id="oSearch" placeholder="検索">
      <button class="icon-btn" id="leftClose" title="閉じる">✕</button>
    </div>
    <div id="outliner"></div>
  </aside>
</div>

<footer id="statusbar" class="hidden"><span id="hints"></span><span id="stats"></span></footer>
<div id="topMenus" class="hidden"></div>
<div id="menuLayer"></div>
<input type="file" id="fileIn" multiple hidden accept=".glb,.gltf,.obj,.fbx,.stl,.png,.jpg,.jpeg,.webp">
<input type="file" id="jsonIn" hidden accept=".json,application/json">
<script type="module" src="app.js"></script>
</body>
</html>
